name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "lua/**"
      - "plugin/**"
      - "Makefile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/nvim-docs.yml@d903a20396dce0f98960a8c9ea96848349682540 # v4.2.0
    with:
      commit-message: "chore(docs): regenerate vim help"

